<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港商業生存大富翁 - 2024 DSE 考題連線版</title>
    <style>
        :root { 
            --board-color: #f7f9fc; 
            --cell-border: #2c3e50; 
            --text-color: #2c3e50; 
        }
        body { 
            font-family: 'Microsoft JhengHei', Arial, sans-serif; 
            background: linear-gradient(135deg, #74b9ff, #a29bfe); 
            margin: 0; padding: 20px; 
            display: flex; flex-direction: column; align-items: center; 
            color: var(--text-color); min-height: 100vh; 
        }
        h1 { color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); font-size: 26px; margin-bottom: 5px; }
        
        /* 遊戲大廳設定 */
        .lobby-container { 
            background: white; padding: 25px; border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); text-align: center; 
            width: 420px; border: 3px solid var(--cell-border); 
        }
        .lobby-input { 
            width: 80%; padding: 10px; margin: 8px 0; font-size: 16px; 
            border: 2px solid #74b9ff; border-radius: 6px; text-align: center; 
        }
        .room-tip { font-size: 13px; color: #666; margin-top: -4px; margin-bottom: 10px; }
        
        /* 大富翁棋盤網格佈局 */
        .monopoly-board { 
            display: grid; grid-template-columns: repeat(11, 1fr); grid-template-rows: repeat(11, 1fr); 
            width: 920px; height: 920px; background-color: var(--board-color); 
            border: 6px solid var(--cell-border); position: relative; border-radius: 12px; 
            display: none; 
        }
        .cell { 
            border: 1px solid var(--cell-border); background-color: #fff; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: space-between; position: relative; box-sizing: border-box; 
            padding: 2px; overflow: hidden; 
        }
        .cell-banner { width: 100%; height: 15px; border-bottom: 1px solid var(--cell-border); }
        .banner-red { background-color: #ff6b81; } 
        .banner-orange { background-color: #ffa502; } 
        .banner-blue { background-color: #1e90ff; }   
        
        .cell-name { 
            flex-grow: 1; display: flex; flex-direction: column; align-items: center; 
            justify-content: center; text-align: center; padding: 2px; 
            line-height: 1.2; font-size: 14px; font-weight: bold; 
        }
        .cell-price { font-size: 11px; color: #718093; margin-top: 2px; }
        .corner-cell { background-color: #fff200; display: flex; align-items: center; justify-content: center; font-weight: bold; text-align: center; }
        
        /* 產業收購標籤樣式 */
        .owned-tag { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(46, 213, 115, 0.25); border: 3px solid #2ed573; 
            pointer-events: none; display: flex; align-items: center; 
            justify-content: center; font-size: 14px; color: #2ed573; font-weight: bold; 
        }
        
        /* 格子坐標定位 */
        .cell-0 { grid-column: 11; grid-row: 11; } .cell-1 { grid-column: 10; grid-row: 11; } .cell-2 { grid-column: 9; grid-row: 11; } .cell-3 { grid-column: 8; grid-row: 11; } .cell-4 { grid-column: 7; grid-row: 11; } .cell-5 { grid-column: 6; grid-row: 11; } .cell-6 { grid-column: 5; grid-row: 11; } .cell-7 { grid-column: 4; grid-row: 11; } .cell-8 { grid-column: 3; grid-row: 11; } .cell-9 { grid-column: 2; grid-row: 11; }
        .cell-10 { grid-column: 1; grid-row: 11; } .cell-11 { grid-column: 1; grid-row: 10; } .cell-12 { grid-column: 1; grid-row: 9; } .cell-13 { grid-column: 1; grid-row: 8; } .cell-14 { grid-column: 1; grid-row: 7; } .cell-15 { grid-column: 1; grid-row: 6; } .cell-16 { grid-column: 1; grid-row: 5; } .cell-17 { grid-column: 1; grid-row: 4; } .cell-18 { grid-column: 1; grid-row: 3; } .cell-19 { grid-column: 1; grid-row: 2; }
        .cell-20 { grid-column: 1; grid-row: 1; } .cell-21 { grid-column: 2; grid-row: 1; } .cell-22 { grid-column: 3; grid-row: 1; } .cell-23 { grid-column: 4; grid-row: 1; } .cell-24 { grid-column: 5; grid-row: 1; } .cell-25 { grid-column: 6; grid-row: 1; } .cell-26 { grid-column: 7; grid-row: 1; } .cell-27 { grid-column: 8; grid-row: 1; } .cell-28 { grid-column: 9; grid-row: 1; } .cell-29 { grid-column: 10; grid-row: 1; }
        .cell-30 { grid-column: 11; grid-row: 1; } .cell-31 { grid-column: 11; grid-row: 2; } .cell-32 { grid-column: 11; grid-row: 3; } .cell-33 { grid-column: 11; grid-row: 4; } .cell-34 { grid-column: 11; grid-row: 5; } .cell-35 { grid-column: 11; grid-row: 6; } .cell-36 { grid-column: 11; grid-row: 7; } .cell-37 { grid-column: 11; grid-row: 8; } .cell-38 { grid-column: 11; grid-row: 9; } .cell-39 { grid-column: 11; grid-row: 10; }
        
        .center-dashboard { grid-column: 2 / 11; grid-row: 2 / 11; background-color: #f1f2f6; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 25px; border: 4px dashed #ffa502; margin: 15px; border-radius: 12px; }
        .status-panel { background: white; padding: 12px 20px; border-radius: 12px; margin-bottom: 12px; width: 85%; border: 2px solid #74b9ff; font-size: 14px; text-align: left; }
        
        /* 15 人玩家名單滾動條優化 */
        .player-list-scroll { max-height: 110px; overflow-y: auto; margin-top: 8px; font-size: 12px; color: #57606f; border-top: 1px solid #f1f2f6; padding-top: 5px; }
        
        /* 計時器與控制區 */
        .timer-banner { background: #2c3e50; color: #fff; padding: 8px 15px; border-radius: 8px; font-size: 18px; font-weight: bold; text-align: center; margin-bottom: 10px; width: 85%; letter-spacing: 1px; }
        .timer-alert { color: #ff4757; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* 多人連線棋子容器 */
        .token-container { position: absolute; bottom: 2px; right: 2px; left: 2px; display: flex; gap: 2px; flex-wrap: wrap; justify-content: flex-end; z-index: 10; }
        .player-token { width: 15px; height: 15px; border-radius: 50%; border: 1px solid #2c3e50; font-size: 9px; font-weight: bold; color: white; display: flex; align-items: center; justify-content: center; }
        
        /* 15色棋子專屬背景 */
        .token-p1 { background: #ff4757; } .token-p2 { background: #2ed573; } .token-p3 { background: #1e90ff; } .token-p4 { background: #ffa502; } .token-p5 { background: #9b59b6; }
        .token-p6 { background: #34495e; } .token-p7 { background: #16a085; } .token-p8 { background: #e67e22; } .token-p9 { background: #b33939; } .token-p10 { background: #218c74; }
        .token-p11 { background: #8e44ad; } .token-p12 { background: #2c3e50; } .token-p13 { background: #d35400; } .token-p14 { background: #718093; } .token-p15 { background: #10ac84; }
        
        .btn { background: linear-gradient(135deg, #ff4757, #ff6b81); color: white; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 25px; cursor: pointer; }
        .btn:disabled { background: #ced6e0; cursor: not-allowed; }
        .btn-exit { background: #718093; padding: 6px 15px; font-size: 12px; border-radius: 5px; margin-top: 8px; }
        
        /* 題目彈出視窗與結算樣式 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 62, 80, 0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: white; padding: 25px; border-radius: 12px; max-width: 600px; width: 90%; border: 3px solid var(--cell-border); max-height: 85vh; overflow-y: auto; }
        .options-container { display: flex; flex-direction: column; gap: 10px; margin: 15px 0; }
        .option-btn { background-color: #f1f2f6; border: 1px solid #ced6e0; padding: 12px; border-radius: 6px; text-align: left; cursor: pointer; font-size: 15px; font-weight: bold; }
        .option-btn:hover { background-color: #74b9ff; color: white; }
        .explanation-box { margin-top: 12px; padding: 12px; background-color: #f1f2f6; border-left: 5px solid #2ed573; display: none; font-size: 14px; }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <h1>✨ 2024 BAFS 試卷一考題 - 多人連線大富翁 ✨</h1>

    <div class="lobby-container" id="lobby">
        <h3>🔑 進入 DSE 考題戰場 (最高支援 15 人)</h3>
        <input type="text" id="roomInput" class="lobby-input" placeholder="請輸入房間號碼">
        <div class="room-tip">💡 已為你自動生成新房間號，同學輸入相同號碼即可加入</div>
        <input type="text" id="nameInput" class="lobby-input" placeholder="請輸入你的名字"><br>
        <button class="btn" style="margin-top:10px; width:85%;" onclick="joinRoom()">連線進入遊戲</button>
    </div>

    <div class="monopoly-board" id="board">
        <div class="center-dashboard">
            <div class="timer-banner" id="gameTimer">⏱️ 剩餘時間：--:--</div>

            <div class="status-panel">
                <div style="font-size:16px; font-weight:bold; color:#1e90ff; margin-bottom:8px; border-bottom:1px dashed #74b9ff; padding-bottom: 5px;">
                    <span>🏠 房間：<span id="roomDisplay">--</span> | 你是：<span id="identityDisplay" style="color:#ff4757;">未登入</span></span>
                </div>
                <div>🎲 <strong>當前輪到：</strong> <span id="turnDisplay" style="color:#ff9f43; font-weight:bold;">等待玩家...</span></div>
                <div style="margin-top: 6px;">💰 <strong>現金資產：</strong> <span id="playerMoney" style="color:#2ed573; font-size:18px; font-weight:bold;">$5,000</span></div>
                <div id="playerList" class="player-list-scroll"></div>
            </div>
            
            <button class="btn" id="rollBtn" onclick="rollDice()" disabled>🎲 擲骰前進</button>
            <div id="diceResult" style="font-size: 15px; font-weight: bold; margin-top: 5px; color: #ff4757;"></div>
            
            <button class="btn btn-exit" onclick="exitRoom()">🚪 清除房間並退出</button>
        </div>
    </div>

    <div class="modal-overlay" id="quizModal">
        <div class="modal">
            <h3 id="modalCardType" style="margin-top:0; color:#ff4757; border-bottom: 2px solid #ced6e0; padding-bottom: 5px;">📋 DSE 商業生存挑戰</h3>
            <p id="quizQuestion" style="font-size: 15px; font-weight: bold;"></p>
            <div class="options-container" id="optionsSpace"></div>
            <div class="explanation-box" id="explanationSpace">
                <strong id="resultStatus"></strong><br><br>
                <strong>【正確答案】：</strong> <span id="correctAnswerStr" style="color:#2ed573; font-weight:bold;"></span><br><br>
                <strong>💡 【官方核心解析】：</strong> <span id="explanationStr"></span>
                <div id="buyLandSection" style="margin-top:15px; display:none; border-top: 2px dashed #ced6e0; padding-top: 10px;">
                    <p style="color:#ffa502; font-weight: bold;">📊 項目營運解鎖，你想全資收購此產業嗎規定？</p>
                    <button class="btn" style="background:#2ed573; width:45%;" id="confirmBuyBtn">🤝 收購資產</button>
                    <button class="btn" style="background:#718093; width:45%;" onclick="passTurn()">❌ 放棄機會</button>
                </div>
            </div>
            <button class="btn" id="closeModalBtn" style="display:none; width:100%; margin-top:15px;" onclick="passTurn()">結束回合</button>
        </div>
    </div>

    <div class="modal-overlay" id="endGameModal">
        <div class="modal" style="text-align:center; border: 4px solid #ff4757;">
            <h2 style="color:#ff4757; margin-top:0;">⏰ 商業生存戰時間到！結算報告</h2>
            <div id="rankListSpace" style="text-align:left; background:#f1f2f6; padding:15px; border-radius:8px; line-height:1.6; font-size:16px;"></div>
            <button class="btn" style="margin-top:20px; width:100%;" onclick="location.reload()">重新返回大廳</button>
        </div>
    </div>

    <script>
        // ------------ 已替換為你專屬的 Firebase 資料庫網址 ------------
        const firebaseConfig = { databaseURL: "https://game-ded49-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 預設遊戲遊玩限時（600 秒 = 10 分鐘，你可以自由修改成 300 或 900）
        const GAME_DEFAULT_TIME = 600; 

        // 2024 BAFS 試卷一全真題數據庫
        const dse2024Questions = [
            { q: "下列哪項是商界對香港經濟的貢獻？<br>(1) 銷售貨品與服務到海外以賺取外匯<br>(2) 為本地居民提供就業機會<br>(3) 為政府帶來稅收", options: ["A. 只有 (1) 及 (2)", "B. 只有 (1) 及 (3)", "C. 只有 (2) 及 (3)", "D. (1)、(2) 及 (3)"], ans: "D", exp: "商界透過出口貿易賺取外匯(1)，作為僱主提供大量工作崗位(2)，並透過繳納利得稅等為政府提供收入(3)。" },
            { q: "與採用扁平式架構及規模相若的商號比較，下列哪項有關採用高架式架構的商號的陳述是正確的？<br>(1) 中層管理人員較多。<br>(2) 它能較迅速回應市場轉變。<br>(3) 管理人員監督較少下屬。", options: ["A. 只有 (1) 及 (2)", "B. 只有 (1) 及 (3)", "C. 只有 (2) 及 (3)", "D. (1)、(2) 及 (3)"], ans: "B", exp: "高架式架構層級較多，因此中層管理人員較多(1)；其控制幅度較窄，意味著每位管理人員監督的下屬較少(3)。迅速回應市場轉變通常是扁平式優點。" },
            { q: "下列哪項是財務報表的用途？<br>(1) 用作評稅<br>(2) 用作分析商號的財務資訊<br>(3) 用作比較行業中不同商號的財務表現", options: ["A. 只有 (1) 及 (2)", "B. 只有 (1) 及 (3)", "C. 只有 (2) 及 (3)", "D. (1)、(2) 及 (3)"], ans: "D", exp: "稅務局利用財務報表評定稅項(1)；投資者和管理層利用其分析財務狀況(2)；報表亦提供標準化數據以供與同行比較(3)。" },
            { q: "下列哪項是自僱人士在強制性公積金（強積金）制度下享有的權利？", options: ["A. 如入息低於$7100，可選擇退出計劃。", "B. 可每年從計劃提取部分累算權益。", "C. 可更改其強積金帳戶的投資組合。", "D. 可選擇每季作一次強積金供款。"], ans: "C", exp: "所有強積金計劃成員（包括自僱人士）都有權根據風險偏好更改投資組合。收入低於最低水平僅指無需強制供款，仍須參加。" },
            { q: "下列哪位是同時關注商號盈利能力和變現能力的財務報表外部使用者？", options: ["A. 高層管理人員", "B. 顧客", "C. 供應商", "D. 政府"], ans: "C", exp: "供應商作為債權人，關注商號的盈利能力以確保長期業務關係，同時極度關注變現能力（流動性）以確保商號能準時支付貨欠。" },
            { q: "莊力最終決定廣告計劃的細節。上司只提供基本的工作指引，根據資料，莊力的上司採用：", options: ["A. 民主式的領導風格……滿足感較高", "B. 民主式的領導風格……合作不足", "C. 自由放任式的領導風格……變得被動", "D. 自由放任式的領導風格……可能會感到沮喪"], ans: "D", exp: "上司僅給予基本指引並讓下屬自行決定細節，屬於自由放任式。缺乏經驗的下屬（剛畢業）在遇到困難時可能因缺乏支持而感到沮喪。" },
            { q: "下列哪項有關試算表的陳述是正確的？<br>(1) 它是在期末調整前編製的。<br>(2) 如試算表不平衡，淨利將會出錯。<br>(3) 如結餘轉下顯示在帳戶的借方，這帳戶的結餘會顯示在試算表的借方欄。", options: ["A. 只有 (1)", "B. 只有 (2)", "C. 只有 (1) 及 (3)", "D. 只有 (2) 及 (3)"], ans: "C", exp: "試算表通常在期末調整前編製(1)。若帳戶結餘在借方（承上結餘b/d在借方），則列於試算表借方(3)。不平衡與淨利無必然直接因果關係。" },
            { q: "若要維持良好個人信貸紀錄，信用卡用戶應：<br>(1) 盡用其信用卡的信用限額<br>(2) 在使用信用卡前評估自己的還款能力<br>(3) 在繳款期限當日或以前清償信用卡欠款", options: ["A. 只有 (1)", "B. 只有 (2)", "C. 只有 (2) 及 (3)", "D. (1)、(2) 及 (3)"], ans: "C", exp: "盡用限額(1)可能被視為財務壓力過大，不利於信用評分。評估能力(2)和準時還款(3)是正確做法。" }
        ];

        let mapCells = [
            { name: "🚀創業起點", type: "special" },
            { name: "香港商界核心", type: "red", price: 1200, qIdx: 0 },
            { name: "高架架構總部", type: "orange", price: 1400, qIdx: 1 },
            { name: "會計師事務所", type: "blue", price: 1600, qIdx: 2 },
            { name: "🛑<br>勞工處檢查站", type: "special" },
            { name: "強積金信託社", type: "orange", price: 1800, qIdx: 3 },
            { name: "物料供應大樓", type: "red", price: 2000, qIdx: 4 },
            { name: "廣告創作公社", type: "blue", price: 2200, qIdx: 5 },
            { name: "🚨<br>消防警告休息區", type: "special" },
            { name: "總分類帳簿局", type: "blue", price: 2400, qIdx: 6 },
            { name: "環球信貸中心", type: "red", price: 2600, qIdx: 7 }
        ];

        let roomRef = null, roomCode = "", myId = "", myName = "", gameState = {}, currentQuiz = null, currentCellPrice = 0, timerInterval = null;

        // 初始化：自動生成 6 位數隨機房間 Code
        function initBoard() {
            const randomCode = Math.floor(100000 + Math.random() * 900000);
            document.getElementById('roomInput').value = randomCode;

            const boardEl = document.getElementById('board');
            mapCells.forEach((cell, index) => {
                const cellEl = document.createElement('div');
                cellEl.className = `cell cell-${index === 0 ? 0 : index === 4 ? 10 : index === 8 ? 20 : index}`;
                if(cell.type === 'special') { 
                    cellEl.classList.add('corner-cell'); 
                    cellEl.innerHTML = `<div>${cell.name}</div><div id="cell-tokens-${index}" class="token-container"></div>`; 
                } else {
                    let bc = cell.type === 'red' ? 'banner-red' : (cell.type === 'orange' ? 'banner-orange' : 'banner-blue');
                    cellEl.innerHTML = `<div class="cell-banner ${bc}"></div><div class="cell-name">${cell.name}<span class="cell-price">$${cell.price}</span></div><div id="owner-${index}"></div><div id="cell-tokens-${index}" class="token-container"></div>`;
                }
                boardEl.appendChild(cellEl);
            });
        }

        // 登入或創建房間
        function joinRoom() {
            roomCode = document.getElementById('roomInput').value.trim();
            myName = document.getElementById('nameInput').value.trim();
            if(!roomCode || !myName) return alert("請輸入完整房間號與名字！");
            
            roomRef = database.ref('rooms/' + roomCode);
            roomRef.once('value', (snapshot) => {
                let data = snapshot.val();
                
                // 重設清空機制：若房間內沒有活躍玩家，代表是第一個進入的人，徹底覆蓋清空舊資料並自動開啟計時
                if (!data || !data.players) {
                    myId = "p1"; 
                    gameState = { 
                        currentTurn: "p1", 
                        timeRemaining: GAME_DEFAULT_TIME,
                        players: { p1: { name: myName, money: 5000, pos: 0, id: "p1" } } 
                    };
                    roomRef.set(gameState).then(() => {
                        startRoomTimer(); // 第一個進入的人負責啟動 Firebase 後台的扣秒
                    });
                } else {
                    let pKeys = Object.keys(data.players || {});
                    if(pKeys.length >= 15) return alert("該房間人數已滿（上限 15 人）！");
                    
                    let nextNum = 1;
                    while(data.players && data.players["p" + nextNum]) { nextNum++; }
                    myId = "p" + nextNum;
                    roomRef.child('players/' + myId).set({ name: myName, money: 5000, pos: 0, id: myId });
                }
                
                document.getElementById('lobby').style.display = 'none';
                document.getElementById('board').style.display = 'grid';
                document.getElementById('roomDisplay').innerText = roomCode;
                document.getElementById('identityDisplay').innerText = `${myName} (${myId.toUpperCase()})`;
                startSyncListener();
            });
        }

        // 第一個玩家自動啟動後台計時扣秒
        function startRoomTimer() {
            timerInterval = setInterval(() => {
                roomRef.child('timeRemaining').transaction((current) => {
                    if (current === null) return GAME_DEFAULT_TIME;
                    if (current <= 1) {
                        clearInterval(timerInterval);
                        return 0;
                    }
                    return current - 1;
                });
            }, 1000);
        }

        // 同步狀態監聽器
        function startSyncListener() {
            roomRef.on('value', (snapshot) => {
                const data = snapshot.val(); if(!data || !data.players) return; gameState = data;
                
                // 1. 同步處理即時倒數時間呈現
                let mins = Math.floor(gameState.timeRemaining / 60);
                let secs = gameState.timeRemaining % 60;
                let timerBanner = document.getElementById('gameTimer');
                
                timerBanner.innerText = `⏱️ 剩餘時間：${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                if(gameState.timeRemaining <= 60) { timerBanner.classList.add('timer-alert'); }

                // 時間到，強制執行結算
                if(gameState.timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('rollBtn').disabled = true;
                    showEndGameRank();
                    return;
                }

                // 2. 判斷輪流順序
                const isMyTurn = (gameState.currentTurn === myId);
                document.getElementById('turnDisplay').innerText = gameState.players[gameState.currentTurn]?.name || "等待中";
                document.getElementById('rollBtn').disabled = !isMyTurn;
                if(gameState.players[myId]) document.getElementById('playerMoney').innerText = `$${gameState.players[myId].money}`;
                
                // 3. 渲染玩家右側列表
                let listHTML = "";
                Object.keys(gameState.players).forEach(pId => {
                    let p = gameState.players[pId];
                    listHTML += `<div style="margin-bottom: 3px;"><b>${p.name}</b> (${pId.toUpperCase()}): $${p.money} (位置:${p.pos})${pId === gameState.currentTurn ? ' 🎲' : ''}</div>`;
                });
                document.getElementById('playerList').innerHTML = listHTML;

                // 4. 更新地圖棋子
                mapCells.forEach((_, idx) => { const c = document.getElementById(`cell-tokens-${idx}`); if(c) c.innerHTML = ""; });
                Object.keys(gameState.players).forEach(pId => {
                    const c = document.getElementById(`cell-tokens-${gameState.players[pId].pos}`);
                    if(c) c.innerHTML += `<div class="player-token token-${pId}" title="${gameState.players[pId].name}">${pId.substring(1)}</div>`;
                });

                // 5. 更新土地產權標籤
                mapCells.forEach((_, idx) => { const label = document.getElementById(`owner-${idx}`); if(label) { label.className = ""; label.innerHTML = ""; } });
                if(gameState.ownedLands) {
                    Object.keys(gameState.ownedLands).forEach(cellIdx => {
                        const label = document.getElementById(`owner-${cellIdx}`);
                        if(label) { 
                            label.className = "owned-tag"; 
                            label.innerHTML = `<span style="font-size:10px; background:rgba(0,0,0,0.6); color:white; padding:1px 3px; border-radius:3px;">${gameState.players[gameState.ownedLands[cellIdx]]?.name || "已購"}</span>`; 
                        }
                    });
                }
            });
        }

        // 擲骰子
        function rollDice() {
            const dice = Math.floor(Math.random() * 4) + 1; 
            document.getElementById('diceResult').innerText = `🎲 你擲出了：${dice} 點！`;
            let p = gameState.players[myId];
            let nextPos = (p.pos + dice) % mapCells.length;
            let money = p.money + (nextPos < p.pos ? 1200 : 0);
            roomRef.child(`players/${myId}`).update({ pos: nextPos, money: money }).then(() => { triggerCellEvent(nextPos); });
        }

        function triggerCellEvent(pos) {
            const cell = mapCells[pos];
            if (cell.type === 'special') return passTurn();
            currentCellPrice = cell.price;
            currentQuiz = dse2024Questions[cell.qIdx];

            if (gameState.ownedLands && gameState.ownedLands[pos]) {
                let oid = gameState.ownedLands[pos];
                if (oid !== myId) {
                    let rent = Math.round(currentCellPrice * 0.2);
                    alert(`踩到 ${gameState.players[oid].name} 的物業！支付營運開支：$${rent}`);
                    roomRef.child(`players/${myId}`).update({ money: gameState.players[myId].money - rent });
                    roomRef.child(`players/${oid}`).update({ money: gameState.players[oid].money + rent });
                }
                return passTurn();
            }
            showQuizModal(currentQuiz);
        }

        function showQuizModal(quiz) {
            document.getElementById('quizQuestion').innerHTML = quiz.q;
            const os = document.getElementById('optionsSpace'); os.innerHTML = '';
            document.getElementById('explanationSpace').style.display = 'none';
            document.getElementById('closeModalBtn').style.display = 'none';
            
            ['A', 'B', 'C', 'D'].forEach((l, idx) => {
                const b = document.createElement('button'); b.className = 'option-btn'; b.innerText = quiz.options[idx];
                b.onclick = () => {
                    document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
                    let correct = (l === quiz.ans);
                    document.getElementById('resultStatus').innerText = correct ? "🎉 決策正確！解鎖收購投資權。" : "❌ 決策錯誤，失去了購入資格。";
                    document.getElementById('resultStatus').style.color = correct ? "#2ed573" : "#ff4757";
                    document.getElementById('correctAnswerStr').innerText = quiz.ans;
                    document.getElementById('explanationStr').innerText = quiz.exp;
                    document.getElementById('explanationSpace').style.display = 'block';
                    if(correct && gameState.players[myId].money >= currentCellPrice) {
                        document.getElementById('buyLandSection').style.display = 'block';
                        document.getElementById('confirmBuyBtn').onclick = () => {
                            roomRef.child(`players/${myId}`).update({ money: gameState.players[myId].money - currentCellPrice });
                            roomRef.child(`ownedLands/${gameState.players[myId].pos}`).set(myId);
                            passTurn();
                        };
                    } else { document.getElementById('closeModalBtn').style.display = 'block'; }
                };
                os.appendChild(b);
            });
            document.getElementById('quizModal').style.display = 'flex';
        }

        function passTurn() {
            document.getElementById('quizModal').style.display = 'none';
            document.getElementById('buyLandSection').style.display = 'none';
            let pKeys = Object.keys(gameState.players);
            let currentIndex = pKeys.indexOf(myId);
            let nextId = pKeys[(currentIndex + 1) % pKeys.length];
            roomRef.update({ currentTurn: nextId });
        }

        // 終局財富資產總值結算
        function showEndGameRank() {
            let leaderboard = [];
            Object.keys(gameState.players).forEach(pId => {
                let p = gameState.players[pId];
                let landValue = 0;
                if(gameState.ownedLands) {
                    Object.keys(gameState.ownedLands).forEach(cellIdx => {
                        if(gameState.ownedLands[cellIdx] === pId) {
                            landValue += mapCells[parseInt(cellIdx)].price;
                        }
                    });
                }
                leaderboard.push({ name: p.name, totalAsset: p.money + landValue, cash: p.money, land: landValue });
            });

            leaderboard.sort((a, b) => b.totalAsset - a.totalAsset);

            let rankHTML = "";
            leaderboard.forEach((player, index) => {
                let medal = index === 0 ? "🏆 冠軍" : (index === 1 ? "🥈 亞軍" : (index === 2 ? "🥉 季軍" : `第 ${index+1} 名`));
                rankHTML += `<div style="padding: 5px 0; border-bottom: 1px solid #ccc;">
                    <strong>${medal}: ${player.name}</strong><br>
                    💰 總資產淨值: $${player.totalAsset} (現金: $${player.cash} | 產權市值: $${player.land})
                </div>`;
            });
            document.getElementById('rankListSpace').innerHTML = rankHTML;
            document.getElementById('endGameModal').style.display = 'flex';
        }

        // 離開房間：清除自己在 Firebase 上的節點，若為最後一人則抹除整個房間
        function exitRoom() {
            if(confirm("確定要清除資料並退出遊戲嗎？")) {
                clearInterval(timerInterval);
                if (roomRef && myId) {
                    roomRef.child('players/' + myId).remove().then(() => {
                        roomRef.child('players').once('value', (snap) => {
                            if(!snap.exists()) { roomRef.remove(); }
                            location.reload();
                        });
                    });
                } else { location.reload(); }
            }
        }

        window.onload = initBoard;
    </script>
</body>
</html>
